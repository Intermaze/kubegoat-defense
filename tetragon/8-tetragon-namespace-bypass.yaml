apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: "block-recon-tools-and-database-clients"
spec:
  podSelector:
    matchLabels:
      run: hacker-container
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
      - index: 0
        type: "string"
      selectors:
      - matchArgs:
        - index: 0
          operator: "Postfix"
          values:
          - "zmap"
          - "nmap"
          - "redis-cli"
          - "mongo"
          - "mysql"
        matchActions:
        - action: Sigkill